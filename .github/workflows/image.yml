name: image

# Builds the Docker image and publishes it to GitHub Container Registry (ghcr.io).
# The repo can stay private; the package's own visibility is set separately in its settings.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name in lower case
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: App version
        run: echo "VERSION=$(node -p "require('./app/package.json').version")" >> "$GITHUB_ENV"
      - name: Tags and platforms
        # A release is a git tag v<version> (which must match app/package.json). It publishes <version>, <major.minor>
        # and "latest" for both architectures; a pre-release such as 2.2.0-rc1 publishes only its own version.
        # main publishes "edge" (what is merged but not yet released). Any other branch publishes a tag named after
        # the branch, for amd64 only. "latest" only ever moves when a release is tagged.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the version in app/package.json ($VERSION)"; exit 1
            fi
            if [ -s app/update-channel.txt ]; then
              echo "::error::app/update-channel.txt is not empty: a release must read app updates from the stable folder"; exit 1
            fi
            if [[ "$VERSION" == *-* ]]; then
              TAGS="$IMAGE:$VERSION"
            else
              TAGS="$IMAGE:latest"$'\n'"$IMAGE:$VERSION"$'\n'"$IMAGE:${VERSION%.*}"
            fi
            { echo "TAGS<<EOF"; echo "$TAGS"; echo "EOF"; echo "PLATFORMS=linux/amd64,linux/arm64"; } >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            { echo "TAGS=$IMAGE:edge"; echo "PLATFORMS=linux/amd64,linux/arm64"; } >> "$GITHUB_ENV"
          else
            B="${GITHUB_REF_NAME//\//-}"
            { echo "TAGS=$IMAGE:$B"; echo "PLATFORMS=linux/amd64"; } >> "$GITHUB_ENV"
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ env.TAGS }}
          labels: |
            org.opencontainers.image.title=Zibbit
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
