<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0c1118">
<link rel="icon" type="image/png" href="/icons/favicon-64.png">
<title>Zibbit TV</title>
<style>
:root{
  --ink:#0c1118; --panel:#131a24; --raised:#1b2432; --line:#28334a;
  --text:#e8ecf3; --mute:#8996ad; --tally:#ff4a3d; --warn:#ffb454; --focus:#9ec5ff; --accent:#4d33e0;
  --cond:"Roboto Condensed","Arial Narrow","Helvetica Neue Condensed","sans-serif-condensed",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --rh:2.9rem; --chan:11.5rem; --topH:34vh;
}
*{box-sizing:border-box}
/* everything is sized in rem, and rem follows the screen width, so one layout fits 720p, 1080p and 4K */
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font:1rem/1.3 var(--body);overflow:hidden;cursor:none}
/* the size comes after the shorthand above, which would otherwise reset it. At a 960-wide screen: Large 16px (how the page looked before this option existed), Medium 14px, Small 12.6px */
html{font-size:calc(100vw / 68)}
html.sz0{font-size:calc(100vw / 76)}
html.sz2{font-size:calc(100vw / 60)}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.foc{outline:.2rem solid var(--focus);outline-offset:-.2rem;background:#26344d!important}

/* ---------- main layout ---------- */
#main{height:100vh;display:grid;grid-template-columns:12rem minmax(0,1fr)}
#main.nos{grid-template-columns:0 minmax(0,1fr)}
#main.nos #side{visibility:hidden;overflow:hidden;border-right:0}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#brand{flex:none;padding:.7rem .9rem .4rem;font:700 1.25rem var(--cond);letter-spacing:.02em}
#brand i{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:#ffd23f;margin-left:.15rem}
#tree{flex:1;min-height:0;overflow:hidden;position:relative}
.tn{display:flex;align-items:center;gap:.5rem;height:1.95rem;padding:0 .7rem;font:600 .95rem var(--cond);white-space:nowrap;overflow:hidden;color:var(--mute);border-left:.3rem solid transparent}
.tn .nm{flex:1;overflow:hidden;text-overflow:ellipsis}
.tn .ct{font:500 .8rem var(--body);color:var(--mute)}
.tn.prov{color:var(--text);font-size:1.2rem;margin-top:.1rem}
.tn.child{padding-left:1.6rem}
.tn.sel{color:var(--text);border-left-color:var(--accent);background:rgba(77,51,224,.18)}
.tn.dim{font-weight:500;font-style:italic}
#setBtn{flex:none;border-top:1px solid var(--line)}
#setBtn .tn{height:2.2rem;color:var(--text)}

#content{display:grid;grid-template-rows:var(--topH) 2rem minmax(0,1fr);min-width:0;min-height:0}
#top{display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:calc((var(--topH) - 1.4rem) * 16 / 9) minmax(0,1fr);gap:1.2rem;padding:.8rem 1.2rem 0;min-height:0;overflow:hidden}
#stage{position:relative;height:100%;width:100%;min-width:0;background:#000;border-radius:.5rem;overflow:hidden;border:.18rem solid transparent}
#stage.foc{outline:none;border-color:var(--focus);background:#000!important}
#video{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;background:#000}
#ov{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:.4rem;padding:1rem;text-align:center;background:rgba(6,9,13,.78)}
#ov strong{font:600 1.3rem var(--cond)}
#ov span{color:var(--mute);max-width:30ch;font-size:.95rem}
.spin{position:relative;width:5.2rem;height:5.2rem;margin-bottom:.5rem;display:grid;place-items:center}
.spin::before{content:'';position:absolute;inset:0;border-radius:50%;border:.22rem solid rgba(255,255,255,.1);border-top-color:var(--focus);border-right-color:var(--focus);animation:spin 1.1s cubic-bezier(.5,.15,.5,.85) infinite}
.spin img{width:3.2rem;height:3.2rem;border-radius:.7rem;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6;transform:scale(.94)}}
@keyframes spin{to{transform:rotate(360deg)}}
#cc{position:absolute;left:5%;right:5%;bottom:6%;text-align:center;pointer-events:none;white-space:pre-line}
#cc span{display:inline;background:rgba(0,0,0,.78);color:#fff;padding:.1em .35em;line-height:1.5;font-family:var(--body);box-decoration-break:clone;-webkit-box-decoration-break:clone}
#fsinfo{position:absolute;left:0;right:0;bottom:0;padding:2rem 2.4rem 1.6rem;background:linear-gradient(transparent,rgba(0,0,0,.85));display:none}
#stage.full #fsinfo.show{display:block}
#recbadge{position:absolute;top:1.4rem;right:2rem;padding:.3rem .8rem;border-radius:.4rem;background:rgba(0,0,0,.6);color:#ff5a5a;font:700 1.2rem var(--cond);letter-spacing:.04em;display:none}
#stage.full #recbadge:not([hidden]){display:block}
#stage.vodp #recbadge{display:none!important}
#fsinfo b{display:block;font:700 1.8rem var(--cond)}
#fsinfo span{color:#cfd7e6;font-size:1.1rem}
#fsinfo em{display:block;font-style:normal;color:#9fb0c8;font-size:1rem;margin-top:.25rem}
#stage.full{position:fixed;inset:0;z-index:50;border:0;border-radius:0;width:auto;height:auto}

#details{position:relative;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:.5rem;padding-top:.2rem}
#chSearch{position:absolute;top:.3rem;right:0}
#nowTop{padding-right:7rem;display:flex;align-items:center;gap:1rem;min-width:0}
#nowLogo{flex:none;width:3.2rem;height:3.2rem;border-radius:.6rem;background:var(--raised);display:grid;place-items:center;overflow:hidden;font:600 1.4rem var(--cond);color:var(--mute)}
#nowLogo img{width:100%;height:100%;object-fit:contain}
#nowName{font:700 1.7rem/1.1 var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nowStat{display:flex;align-items:center;gap:.5rem;color:var(--mute);font-size:.9rem}
.lamp{width:.8rem;height:.8rem;border-radius:50%;background:#38435a}
.lamp.on{background:var(--tally);box-shadow:0 0 .8rem .1rem rgba(255,74,61,.65)}
#nowProg{font:600 1.25rem var(--cond)}
#nowTime{color:var(--mute);font-size:.95rem}
#bar{height:.3rem;border-radius:.2rem;background:var(--line);overflow:hidden;max-width:34rem}
#bar i{display:block;height:100%;width:0;background:var(--text)}
#nowDesc{color:#b4bfd2;font-size:.95rem;line-height:1.35;max-width:46rem;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}

/* ---------- toolbar ---------- */
#tool{display:flex;align-items:center;gap:.6rem;padding:0 1.2rem;border-bottom:1px solid var(--line);min-width:0}
.chip{height:1.9rem;padding:0 .9rem;border-radius:999px;background:var(--raised);border:1px solid var(--line);font:600 .95rem var(--cond);display:flex;align-items:center;white-space:nowrap}
#hl{flex:1;min-width:0;text-align:right;color:var(--mute);font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hl b{color:var(--text);font-weight:600}

/* ---------- movies and shows ---------- */
.tn.c2{padding-left:2.5rem}
.tn.on{color:var(--text);border-left-color:var(--accent);background:rgba(77,51,224,.18)}
#main.vod #chSearch,#main.vod #nowStat{display:none}
#main:not(.vod) #vSort{display:none}
#chSearch{display:none!important}
#vSort{height:auto;padding:0;border:0;background:none;border-radius:0;font:500 .8rem var(--body);color:var(--mute)}
#guide.ls #times,#guide.ls #rows{display:none}
#wall .lsh{grid-column:1/-1;font:700 1rem var(--cond);color:var(--text)}
#wall .lsn{grid-column:1/-1;color:var(--mute);font-size:.8rem}
.lt{position:relative;height:6.2rem;box-sizing:border-box;min-width:0;border-radius:.6rem;background:var(--raised);border:.15rem solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;padding:.4rem;text-align:center}
.lt.foc{outline:none;border-color:var(--focus);background:#26344d}
.lt .lgs{width:2.8rem;height:2.8rem;border-radius:.5rem;background:var(--ink);display:grid;place-items:center;overflow:hidden;font:700 1.1rem var(--cond)}
.lt .lgs img{max-width:100%;max-height:100%}
.lt .ln{font:600 .72rem/1.15 var(--cond);max-height:1.7rem;overflow:hidden;color:#cfd7e6}
.lt .lb{position:absolute;top:.2rem;right:.35rem;font-size:.85rem;color:#ffd23f}
.lt .lnp{position:absolute;top:.2rem;left:.35rem;font-size:.75rem;color:var(--tally)}
#guide.vod #times,#guide.vod #rows{display:none}
#wall{flex:1;min-height:0;display:grid;align-content:start;gap:.5rem .4rem;padding:.5rem 1rem 0;overflow:hidden}
#wall .wmsg{grid-column:1/-1;display:grid;place-content:center;justify-items:center;gap:.4rem;text-align:center;min-height:8rem;color:var(--mute)}
#wall .wmsg strong{font:600 1.3rem var(--cond);color:var(--text)}
.vc{min-width:0;padding:.25rem;border-radius:.45rem;border:.15rem solid transparent}
.vc.foc{outline:none;border-color:var(--focus)}
.vp{position:relative;height:0;padding-top:150%;border-radius:.3rem;overflow:hidden;background:var(--raised)}
.vp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vp .vi{position:absolute;inset:0;display:grid;place-items:center;font:700 1.5rem var(--cond);color:var(--mute)}
.vp .vx{font-size:2rem}
.vp .vm{position:absolute;left:0;right:0;bottom:0;height:.3rem;background:rgba(0,0,0,.65)}
.vp .vm i{display:block;height:100%;background:var(--tally)}
.vt{font:600 .72rem/1.15 var(--cond);margin-top:.3rem;height:1.7rem;overflow:hidden;color:#cfd7e6}
#ov .vbk{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5}
#ov .vbk.pst{object-fit:contain;opacity:1}
#stage.poster{background:transparent}
#stage.poster #video{visibility:hidden}
#stage.poster #ov{background:transparent;padding:0}
#ov .vbk.pst{border-radius:.5rem}
#stage.poster .vcta{left:50%;right:auto;width:max-content;max-width:94%;transform:translateX(-50%);bottom:.5rem;padding:.25rem .8rem;border-radius:.4rem;background:rgba(0,0,0,.72)}
#ov:has(.vcta){background:#000;padding:0}
#ov .vcta{position:absolute;left:0;right:0;bottom:0;padding:.35rem .6rem;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.85))}
#ov .vcta span{color:var(--text);font-size:.95rem;max-width:none}
.shead{font:700 1rem var(--cond);color:var(--text);margin-top:.5rem}
#main.vod #nowDesc{order:1}
#main.vod #nowProg{order:2;font-size:.95rem}
#main.vod #nowTime{order:3;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#main.vod #details{gap:.25rem}
#main.vod #nowLogo{display:none}
#main.vod #nowTop{padding-right:0}
#main.vod #nowDesc{display:block;-webkit-line-clamp:unset;overflow:hidden;flex:1;min-height:0;max-height:none;scroll-behavior:auto}
#details.vmore::after{content:'▼ more';position:absolute;right:.4rem;bottom:0;color:var(--focus);font:600 .8rem var(--cond);background:var(--ink);padding:0 .3rem}
#details.vup::before{content:'▲';position:absolute;right:.4rem;top:5.6rem;color:var(--focus);font-size:.8rem}
#vbar{position:absolute;left:0;right:0;bottom:0;padding:2rem 2.4rem 1.6rem;background:linear-gradient(transparent,rgba(0,0,0,.9));display:none}
#stage.full #vbar.show{display:block}
#stage.vodp #fsinfo{display:none!important}
#vbar b{display:block;font:700 1.6rem var(--cond)}
#vbar .trk{position:relative;height:.45rem;border-radius:.3rem;background:rgba(255,255,255,.28);margin:.8rem 0 .5rem}
#vbar .trk i{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff;border-radius:.3rem}
#vbar .trk u{position:absolute;top:-.35rem;width:.3rem;height:1.15rem;margin-left:-.15rem;background:var(--focus);border-radius:.15rem}
#vbar span{color:#cfd7e6;font-size:1.15rem}

/* ---------- guide ---------- */
#guide{position:relative;min-height:0;display:flex;flex-direction:column;padding:0 0 0 0}
#times{flex:none;position:relative;height:1.7rem;margin-left:var(--chan);overflow:hidden;border-bottom:1px solid var(--line)}
#timesTrack{position:absolute;top:0;bottom:0;left:0;will-change:transform}
.tk{position:absolute;top:0;bottom:0;padding:.4rem 0 0 .5rem;border-left:1px solid var(--line);color:var(--mute);font:600 .8rem var(--cond)}
#rows{flex:1;min-height:0;position:relative;overflow:hidden}
.grow{position:absolute;left:0;right:0;height:var(--rh);border-bottom:1px solid #1d2635}
.gch{position:absolute;left:0;top:0;bottom:0;width:var(--chan);display:flex;align-items:center;gap:.5rem;padding:0 .5rem 0 .7rem;background:var(--panel);z-index:3;border-right:1px solid var(--line)}
.gch .lg{flex:none;width:2.1rem;height:2.1rem;border-radius:.3rem;background:var(--raised);display:grid;place-items:center;overflow:hidden;font:600 .8rem var(--cond);color:var(--mute)}
.gch .lg img{width:100%;height:100%;object-fit:contain}
.gch .nm{flex:1;min-width:0;font:600 .95rem var(--cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gch .pl{flex:none;color:var(--tally);font-size:.8rem}
.gch .fv{flex:none;color:#ffd23f;font-size:.8rem}
.grow.live .gch{box-shadow:inset .3rem 0 0 var(--tally)}
.slots{position:absolute;left:var(--chan);right:0;top:0;bottom:0;overflow:hidden}
.track{position:absolute;top:0;bottom:0;left:0;will-change:transform}
.pg{position:absolute;top:.15rem;bottom:.15rem;padding:.25rem .5rem;border-radius:.3rem;background:var(--raised);overflow:hidden;white-space:nowrap}
.pg b{display:block;font:600 .92rem var(--cond);overflow:hidden;text-overflow:ellipsis}
.pg i{display:block;font:normal .72rem var(--body);color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.pg.cur{background:#223049}
.pg.foc{z-index:1;min-width:4.5rem}
.pg.none{background:transparent;color:var(--mute)}
.nowline{position:absolute;top:0;bottom:0;width:.15rem;background:var(--tally);opacity:.8;z-index:2}
#gmsg{position:absolute;inset:1.7rem 0 0 0;display:grid;place-content:center;text-align:center;gap:.5rem;color:var(--mute)}
#gmsg strong{font:600 1.4rem var(--cond);color:var(--text)}
#gmsg span{font-size:1rem;max-width:36ch}

/* ---------- modals ---------- */
.modal.fsroot{background:linear-gradient(transparent 50%,rgba(0,0,0,.78));place-items:end center;padding-bottom:3.2rem}
.fsmeta{position:absolute;left:0;right:0;bottom:1.1rem;text-align:center;font:600 .8rem var(--cond);color:#9fb0c8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2rem}
.mbox.fsb{flex-direction:row;background:none;border:0;padding:0;gap:1.2rem;max-width:96vw}
.mbox.fsb.flat{gap:.6rem}
.mbox.fsb.flat .mb.sq{width:6.8rem;height:6.8rem;padding:.4rem;gap:.3rem;font-size:.8rem}
.mbox.fsb.flat .mb.sq .lgs{width:2.7rem;height:2.7rem;font-size:1rem}
.mbox.fsb.flat .mb.sq .ic{font-size:1.85rem}
.mbox.fsb.flat .mb.sq small{font-size:.65rem}
.mb.sq{flex-direction:column;width:8.5rem;height:8.5rem;min-height:0;gap:.35rem;padding:.5rem;white-space:normal;text-align:center;line-height:1.15;font-size:.95rem;border-radius:.8rem}
.mb.sq .ic{font-size:2.3rem;line-height:1}
.mb.sq .lgs{width:3.4rem;height:3.4rem;border-radius:.6rem;background:var(--ink);display:grid;place-items:center;overflow:hidden;font:700 1.2rem var(--cond)}
.mb.sq .lgs img{max-width:100%;max-height:100%}
.mb.sq small{color:var(--mute);font:500 .75rem var(--body)}
.mbox.who{align-items:center;padding:2.4rem 3.2rem;gap:1.8rem}
.whorow{display:flex;gap:1.4rem;flex-wrap:wrap;justify-content:center;max-width:70rem}
.mb.tile{flex-direction:column;min-height:0;width:9.5rem;padding:1.1rem .6rem;gap:.7rem;background:transparent;border:2px solid transparent;border-radius:.8rem}
.tile .av{display:grid;place-items:center;width:5.6rem;height:5.6rem;border-radius:50%;background:var(--raised);font:700 2rem var(--cond)}
.tile.add .av{background:none;border:2px dashed var(--line);color:var(--mute)}
.tile .nm{font:600 1.1rem var(--cond);max-width:100%;overflow:hidden;text-overflow:ellipsis}
.mb.tile.foc{background:var(--raised);border-color:var(--focus)}
.pindots{display:flex;justify-content:center;gap:1.1rem;margin:.2rem 0}
.pindots i{width:1.1rem;height:1.1rem;border-radius:50%;border:.15rem solid var(--mute)}
.pindots i.on{background:var(--text);border-color:var(--text)}
.pinmsg{min-height:2.6rem;text-align:center;font-size:1rem}
.pinmsg.bad{color:var(--warn)}
.pinpad{display:grid;grid-template-columns:repeat(3,5.6rem);gap:.6rem;justify-content:center}
.pinpad .mb{height:3.6rem;min-width:0;padding:0;font-size:1.5rem}
.modal{position:fixed;inset:0;z-index:100;background:rgba(5,8,12,.82);display:grid;place-items:center}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:1.2rem 1.4rem;max-width:90vw;max-height:90vh;display:flex;flex-direction:column;gap:1rem}
.mbox h2{margin:0;font:700 1.45rem var(--cond)}
.mbox p{margin:0;color:var(--mute);font-size:1rem;max-width:44rem;line-height:1.4}
.mb{display:flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.3rem;padding:0 1rem;border-radius:.4rem;background:var(--raised);border:1px solid var(--line);font:600 1.05rem var(--cond);white-space:nowrap}
.mb.primary{background:var(--text);color:var(--ink)}
.mrow{display:flex;gap:1rem;flex-wrap:wrap}
.srow{justify-content:space-between;min-width:30rem;text-align:left}
.srow .v{color:var(--focus);font-weight:700}
.srow.dis{opacity:.5}
#setBox{width:36rem}
#setList{display:flex;flex-direction:column;gap:.5rem;overflow:hidden}
.note{color:var(--mute);font-size:.95rem}
/* keyboard */
#oskIn{min-width:26rem;min-height:2.6rem;padding:.3rem .8rem;border-radius:.4rem;background:#0a0f16;border:1px solid var(--line);font:600 1.3rem var(--body);display:flex;align-items:center;overflow:hidden;white-space:pre}
#oskIn u{display:inline-block;width:.12rem;height:1.3rem;background:var(--focus);margin-left:.1rem;text-decoration:none;animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.krow{display:flex;gap:.45rem;justify-content:center}
.k{flex:1 1 0;min-width:2.8rem;padding:0 .3rem}
.k.w2{flex:2 1 0}.k.w3{flex:3 1 0}.k.w5{flex:5 1 0}
#oskKeys{display:flex;flex-direction:column;gap:.35rem;width:38rem}
/* manage groups */
#catList{overflow:hidden;display:flex;flex-direction:column;gap:.2rem;height:52vh;width:34rem;position:relative}
.crow{display:flex;align-items:center;gap:.7rem;min-height:2.2rem;padding:0 .8rem;border-radius:.35rem;background:var(--raised);font:600 1rem var(--cond);flex:none}
.crow .bx{flex:none;width:1.3rem;height:1.3rem;border:.15rem solid var(--mute);border-radius:.25rem;display:grid;place-items:center;font-size:1rem;line-height:1}
.crow.on .bx{background:var(--text);border-color:var(--text);color:var(--ink)}
.crow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .ct{color:var(--mute);font-weight:500}
/* letters */
#letters{display:grid;grid-template-columns:repeat(9,3.4rem);gap:.4rem}
#letters .mb{padding:0}

#toast{position:fixed;left:50%;bottom:2rem;transform:translateX(-50%);z-index:200;background:#e8ecf3;color:#0c1118;font:600 1rem var(--cond);padding:.5rem 1.1rem;border-radius:.6rem;max-width:70vw}

/* ---------- pairing + messages ---------- */
#gate{position:fixed;inset:0;z-index:90;background:radial-gradient(120% 90% at 50% 0%,#16202f 0%,var(--ink) 62%);display:grid;place-items:center}
#gateBox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2.6rem;align-items:center;width:46rem;max-width:92vw;padding:2.4rem 2.6rem;background:var(--panel);border:1px solid var(--line);border-radius:1.1rem;box-shadow:0 1.2rem 3rem rgba(0,0,0,.45)}
#gateBrand{display:flex;align-items:center;gap:.5rem;font:700 1.1rem var(--cond);letter-spacing:.03em;color:var(--mute)}
#gateBrand i{width:.6rem;height:.6rem;border-radius:50%;background:var(--tally)}
#gateBox h1{margin:.7rem 0 .5rem;font:700 2rem/1.1 var(--cond)}
#gateBox p{margin:.2rem 0;font-size:1.05rem;color:#b4bfd2;line-height:1.45}
#gateUrl{margin:.1rem 0 .9rem;font:600 1.15rem var(--body);color:var(--focus);word-break:break-all}
#code{display:flex;gap:.4rem;margin:.5rem 0 1rem}
#code span{display:grid;place-items:center;width:2.2rem;height:3rem;background:var(--raised);border:1px solid var(--line);border-radius:.45rem;font:700 1.7rem ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#fff}
#code span.dash{width:1rem;background:none;border:0;color:var(--mute)}

<script>
/* The Zibbit TV page. Pairing first (it needs nothing but a code), then the real thing once a session exists.
   hls.js / mpegts.js are loaded only after sign-in, because the server hands them to signed-in sessions only. */
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* storage unavailable */ } }
};
const fmtTime = (sec) => new Date(sec * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const fmtRate = (bps) => (bps >= 1e9 ? (bps / 1e9).toFixed(2) + ' Gb/s' : bps >= 1e6 ? (bps / 1e6).toFixed(1) + ' Mb/s' : Math.round(bps / 1e3) + ' kb/s');
const initials = (n) => String(n).replace(/[^A-Za-z0-9 ]/g, '').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase() || '?';
const jpost = (path, body) => fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });

function toast(msg, ms) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { t.hidden = true; }, ms || 2800);
}

/* ================= modal layer + keyboard-style navigation =================
   Every pop-up (keyboard, settings, groups...) is a "modal" with buttons marked .mb.
   Arrow keys jump to the nearest button in that direction; OK presses it; Back closes. */
const MODALS = [];
function modal(cls) {
  const root = el('div', 'modal'), box = el('div', 'mbox ' + (cls || ''));
  root.append(box); document.body.append(root);
  const m = { root, box, foc: null, onkey: null, onclose: null,
    focus(e) { if (m.foc) m.foc.classList.remove('foc'); m.foc = e; if (e) { e.classList.add('foc'); if (e.scrollIntoView) e.scrollIntoView({ block: 'nearest' }); } },
    close(v) { const i = MODALS.indexOf(m); if (i >= 0) MODALS.splice(i, 1); root.remove(); if (m.onclose) m.onclose(v); } };
  MODALS.push(m);
  return m;
}
const mbs = (m) => [...m.box.querySelectorAll('.mb')].filter((e) => !e.hidden && e.offsetParent !== null);
function spatial(m, dir) {
  const list = mbs(m), cur = m.foc;
  if (!cur || !list.includes(cur)) { m.focus(list[0] || null); return; }
  const a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, bs = Infinity;
  const sideways = dir === 'left' || dir === 'right';
  // sideways moves stay on the same row when it has anything that way (wide keys such as Space are far, and a near key in the row above would win)
  const sameRow = sideways && list.some((e) => { if (e === cur) return false; const r = e.getBoundingClientRect(); return Math.abs(r.top + r.height / 2 - ay) < a.height / 2 && (dir === 'right' ? r.left + r.width / 2 > ax + 2 : r.left + r.width / 2 < ax - 2); });
  for (const e of list) {
    if (e === cur) continue;
    const r = e.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    const dx = x - ax, dy = y - ay;
    if (sameRow && Math.abs(dy) >= a.height / 2) continue;
    let main, cross;
    if (dir === 'down') { if (dy <= 2) continue; main = dy; cross = Math.abs(dx); }
    else if (dir === 'up') { if (dy >= -2) continue; main = -dy; cross = Math.abs(dx); }
    else if (dir === 'right') { if (dx <= 2) continue; main = dx; cross = Math.abs(dy); }
    else { if (dx >= -2) continue; main = -dx; cross = Math.abs(dy); }
    const s = main + cross * 2.2;
    if (s < bs) { bs = s; best = e; }
  }
  if (best) m.focus(best);
}
function modalKey(m, k, e) {
  if (m.onkey && m.onkey(k, e)) return;
  const f = m.foc;
  if (k === 'ok') { if (f && f._act) f._act(); return; }
  if (k === 'back') { m.close(null); return; }
  if (!['up', 'down', 'left', 'right'].includes(k)) return;
  if (f && f._cycle && (k === 'left' || k === 'right')) { f._cycle(k === 'right' ? 1 : -1); return; }
  if (f && f.classList.contains('crow') && (k === 'up' || k === 'down')) { // long lists step through their siblings
    let n = k === 'down' ? f.nextElementSibling : f.previousElementSibling;
    while (n && n.hidden) n = k === 'down' ? n.nextElementSibling : n.previousElementSibling;
    if (n && n.classList.contains('crow')) { m.focus(n); return; }
  }
  spatial(m, k);
}
const btn = (label, act, cls) => { const b = el('div', 'mb ' + (cls || ''), label); b._act = act; return b; };

/* ---- on-screen keyboard (a physical keyboard types into it too) ---- */
function osk({ title, value, mask, okLabel, hint }) {
  return new Promise((resolve) => {
    const m = modal('osk');
    let v = value || '', shift = false, show = !mask, done = false;
    const finish = (r) => { if (done) return; done = true; m.close(r); };
    m.onclose = (r) => resolve(r === undefined ? null : r);
    const inp = el('div'); inp.id = 'oskIn';
    const draw = () => { inp.replaceChildren(document.createTextNode(show ? v : '•'.repeat(v.length)), el('u')); };
    const keys = el('div'); keys.id = 'oskKeys';
    const add = (row, label, act, cls) => { const b = btn(label, act, 'k ' + (cls || '')); row.append(b); return b; };
    const rows = ['1234567890', 'qwertyuiop', 'asdfghjkl-', 'zxcvbnm._@'];
    const letterBtns = [];
    const typed = (ch) => { v += ch; draw(); };
    for (const r of rows) {
      const row = el('div', 'krow');
      for (const ch of r) { const b = add(row, ch, () => { typed(shift ? ch.toUpperCase() : ch); if (shift) { shift = false; refresh(); } }); b._ch = ch; letterBtns.push(b); }
      keys.append(row);
    }
    const r5 = el('div', 'krow');
    const shiftB = add(r5, '⇧ Shift', () => { shift = !shift; refresh(); }, 'w2');
    add(r5, ':', () => typed(':')); add(r5, '/', () => typed('/'));
    add(r5, 'Space', () => typed(' '), 'w3');
    add(r5, '⌫', () => { v = v.slice(0, -1); draw(); }, 'w2');
    keys.append(r5);
    const r6 = el('div', 'krow');
    add(r6, 'Clear', () => { v = ''; draw(); }, 'w2');
    if (mask) { const sb = add(r6, show ? 'Hide' : 'Show', () => { show = !show; sb.textContent = show ? 'Hide' : 'Show'; draw(); }, 'w2'); }
    add(r6, 'Cancel', () => finish(null), 'w2');
    add(r6, okLabel || 'OK', () => finish(v), 'w2 primary');
    keys.append(r6);
    const refresh = () => { for (const b of letterBtns) if (/[a-z]/.test(b._ch)) b.textContent = shift ? b._ch.toUpperCase() : b._ch; shiftB.classList.toggle('primary', shift); };
    m.box.append(el('h2', '', title), ...(hint ? [el('p', '', hint)] : []), inp, keys);
    draw();
    m.focus(keys.querySelector('.k'));
    m.onkey = (k, e) => {
      if (e && e.key && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { typed(e.key); return true; }
      if (e && e.key === 'Backspace') { v = v.slice(0, -1); draw(); return true; }
      if (e && e.key === 'Enter' && e.shiftKey) { finish(v); return true; }
      return false;
    };
  });
}
const OSK_KEYS_FROM_PHYSICAL = true; // eslint-disable-line no-unused-vars

/* ================= network helpers ================= */
async function api(path, opts) {
  const r = await fetch(path, opts);
  let j = null;
  try { j = await r.json(); } catch { /* not json */ }
  if (r.status === 401) { const e = new Error('Signed out'); e.status = 401; throw e; }
  if (!r.ok) { const e = new Error((j && j.error) || `Request failed (${r.status})`); e.status = r.status; e.body = j; throw e; }
  return j;
}
const send = (path, body, method = 'PUT') => api(path, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
const loadScript = (src) => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('Could not load ' + src)); document.head.append(s); });

/* ================= profiles on this TV =================
   Each profile paired on this TV leaves a token here (it carries TV rights only). The start screen offers them all. */
const profiles = {
  all() { try { const a = JSON.parse(store.get('tv.profiles')); return Array.isArray(a) ? a.filter((x) => x && x.name && x.token) : []; } catch { return []; } },
  save(a) { store.set('tv.profiles', JSON.stringify(a)); },
  put(name, token) { const a = this.all(), i = a.findIndex((x) => x.name === name); if (i >= 0) a[i].token = token; else a.push({ name, token }); this.save(a); },
  drop(name) { this.save(this.all().filter((x) => x.name !== name)); }
};
const picked = { get() { try { return sessionStorage.getItem('tv.picked') === '1'; } catch { return false; } }, set(on) { try { if (on) sessionStorage.setItem('tv.picked', '1'); else sessionStorage.removeItem('tv.picked'); } catch { /* fine */ } } };
function showProfiles(fromSettings) { // fromSettings: someone is signed in and chose Switch profile, so Back returns to them
  $('#main').hidden = true; $('#gate').hidden = true;
  const m = modal('who');
  m.onkey = (k) => {
    if (k !== 'back') return false;
    if (fromSettings) { m.close(); $('#main').hidden = false; }  // otherwise there is nowhere to go back to
    return true;
  };
  m.box.append(el('h2', '', 'Who’s watching?'));
  const row = el('div', 'whorow');
  async function pick(pr) {
    try {
      if (fromSettings && S.me && S.me.name === pr.name) { m.close(); $('#main').hidden = false; return; } // already them
      if (fromSettings) stopPlayback('Switching', '');
      const r = await send('/api/tv/switch', { token: pr.token }, 'POST');
      profiles.put(r.name, r.token); picked.set(true); location.reload();
    } catch (e) {
      if (e.status === 401) { profiles.drop(pr.name); toast(pr.name + ' was signed out. Add the profile again.'); m.close(); if (profiles.all().length) showProfiles(); else showGate(); }
      else toast('Couldn’t reach the server');
    }
  }
  for (const pr of profiles.all()) { const t = btn('', () => pick(pr), 'tile'); t.append(el('span', 'av', initials(pr.name)), el('span', 'nm', pr.name)); row.append(t); }
  const add = btn('', () => { m.close(); picked.set(true); showGate(); }, 'tile add'); add.append(el('span', 'av', '+'), el('span', 'nm', 'Add profile'));
  row.append(add);
  m.box.append(row);
  m.focus(row.firstChild);
}

/* ================= pairing screen ================= */
async function showGate(message) {
  $('#main').hidden = true;
  const gate = $('#gate'); gate.hidden = false;
  let stop = false;
  const sub = $('#gateSub'), err = $('#gateErr');
  if (message) err.textContent = message;
  const gpw = $('#gPw');
  let busy = false;
  const gateKey = (e) => {
    if (busy || MODALS.length) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); passwordSignIn(); }
  };
  document.addEventListener('keydown', gateKey);
  gpw.addEventListener('click', passwordSignIn);
  async function passwordSignIn() {
    if (busy) return;
    busy = true;
    try { await passwordFlow(); } finally { setTimeout(() => { busy = false; }, 300); }
  }
  async function passwordFlow() {
    const name = await osk({ title: 'Sign in: your name', value: store.get('tv.name') || '', okLabel: 'Next' });
    if (name == null || !name.trim()) return;
    const pw = await osk({ title: 'Sign in: password for ' + name.trim(), mask: true, okLabel: 'Sign in' });
    if (pw == null) return;
    try {
      const r = await jpost('/api/login', { name: name.trim(), password: pw });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { err.textContent = j.error || 'Could not sign in.'; return; }
      store.set('tv.name', name.trim());
      stop = true; location.reload();
    } catch { err.textContent = 'Could not reach the server.'; }
  }
  while (!stop) {
    let st;
    try {
      const r = await jpost('/api/pair/start', { label: 'Zibbit TV' });
      st = await r.json();
      if (!r.ok) { sub.textContent = st.error || 'Could not get a code.'; await sleep(15000); continue; }
    } catch { sub.textContent = 'Can’t reach the server. Retrying…'; await sleep(5000); continue; }
    $('#code').replaceChildren(...[...st.code].map((ch) => { const e = document.createElement('span'); if (ch === '-') e.className = 'dash'; e.textContent = ch; return e; }));
    $('#gateUrl').textContent = st.url ? st.url.replace(/^https?:\/\//, '') : 'your Zibbit address, then /pair';
    sub.textContent = 'Waiting for approval on your phone…';
    const qr = $('#qr');
    qr.hidden = true;
    if (st.link && window.qrcode) {
      try { const q = qrcode(0, 'M'); q.addData(st.link); q.make(); qr.innerHTML = q.createSvgTag({ scalable: true, margin: 0 }); qr.hidden = false; } catch { /* the code still works */ }
    }
    const until = Date.now() + st.expiresIn * 1000;
    while (!stop && Date.now() < until) {
      await sleep((st.interval || 3) * 1000);
      try {
        const r = await jpost('/api/pair/poll', { device: st.device });
        const j = await r.json().catch(() => ({}));
        if (j.status === 'approved') { stop = true; if (j.token) profiles.put(j.name, j.token); picked.set(true); sub.textContent = 'Approved. Starting…'; location.reload(); return; }
        if (j.status === 'expired') break;
      } catch { /* keep trying until the code runs out */ }
    }
  }
}

/* ================= signed-in app ================= */
const S = {
  providers: [], pid: null, me: {}, boots: new Map(), open: new Set(), sel: null,
  items: [], total: 0, current: null, starting: false, playing: false, tearing: false, hls: null, ts: null,
  triedTs: false, netRetries: 0, mediaRetries: 0, epg: [], playSeq: 0, needTap: false, wake: null, truncated: false,
  timers: { pause: null, hidden: null, waiting: null, fs: null }, loadSeq: 0
};
const settings = Object.assign({ pauseStop: 120, hiddenStop: 120, cc: 0, ccSize: 1, uiSize: 1 }, (() => { try { return JSON.parse(store.get('tv.settings')) || {}; } catch { return {}; } })());
const saveSettings = () => store.set('tv.settings', JSON.stringify(settings));
const TV_BUILD = 'nov11-i'; let sizeFoot = null;
const UI_SIZES = [[0, 'Small'], [1, 'Medium'], [2, 'Large']]; // Medium is the stylesheet's own size; the others only add a class (see html.sz0 / html.sz2)
function applyUiSize() {
  const c = document.documentElement.classList;
  c.remove('sz0', 'sz2');
  if (settings.uiSize === 0) c.add('sz0'); else if (settings.uiSize === 2) c.add('sz2');
}
applyUiSize();
const CID = (() => {
  let c = store.get('tv.cid');
  if (!/^[A-Za-z0-9_-]{8,40}$/.test(c || '')) { c = 't' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); store.set('tv.cid', c); }
  return c;
})();
const ALL = '__all__';
/* the last few channels watched on this TV by this profile, newest first */
const recent = {
  key() { return 'tv.recent.' + (S.me.name || ''); },
  all() { try { const a = JSON.parse(store.get(this.key())); return Array.isArray(a) ? a.filter((x) => x && x.p && x.s) : []; } catch { return []; } },
  clear() { store.set(this.key(), '[]'); },
  add(p, it, l) { const a = this.all().filter((x) => !(x.p === p && x.s === it.s)); const e = { p, s: it.s, n: it.n, i: it.i || '' }; if (l) e.l = l; a.unshift(e); store.set(this.key(), JSON.stringify(a.slice(0, 5))); }
};
const prov = (id) => S.providers.find((p) => p.id === (id || S.pid));
const video = $('#video');
let zone = 'side'; // side | tool | prev | guide | set
let fullscreen = false;

/* ---------- details panel ---------- */
function nowNext() {
  const t = Date.now() / 1000;
  const i = S.epg.findIndex((e) => e.start <= t && t < e.end);
  return i >= 0 ? S.epg[i] : null;
}
let rateLast = null, rateNow = 0;
function renderNow() {
  if (S.mode === 'vod') return;
  const c = S.current;
  const logo = $('#nowLogo'); logo.replaceChildren();
  if (!c) {
    $('#nowName').textContent = 'No channel selected';
    for (const id of ['#nowProg', '#nowTime', '#nowDesc']) $(id).textContent = '';
    $('#bar').hidden = true;
    return;
  }
  if (c.i) { const img = new Image(); img.alt = ''; img.src = c.i; img.onerror = () => { img.remove(); logo.textContent = initials(c.n); }; logo.append(img); } else logo.textContent = initials(c.n);
  $('#nowName').textContent = c.n;
  const cur = nowNext();
  $('#nowProg').textContent = cur ? cur.title : 'No guide data for this channel';
  $('#nowTime').textContent = cur ? `${fmtTime(cur.start)} to ${fmtTime(cur.end)}` : '';
  $('#nowDesc').textContent = cur && cur.desc ? cur.desc : '';
  const bar = $('#bar'); bar.hidden = !cur;
  if (cur) $('i', bar).style.width = Math.min(100, Math.max(0, ((Date.now() / 1000 - cur.start) / (cur.end - cur.start)) * 100)) + '%';
  const fi = $('#fsinfo');
  $('b', fi).textContent = c.n;
  $('span', fi).textContent = cur ? `${cur.title}   ${fmtTime(cur.start)} to ${fmtTime(cur.end)}` : '';
}
async function loadCurrentEpg() {
  const c = S.current;
  if (!c) return;
  try {
    const j = await api(`/api/p/${c.p}/epg?s=${c.s}`);
    if (S.current && S.current.s === c.s && S.current.p === c.p) { S.epg = j.list; renderNow(); }
  } catch { /* guide is optional */ }
}
setInterval(() => {
  if (!S.current) return;
  const cur = nowNext();
  if (!cur && S.epg.length === 0) return;
  if (!cur || Date.now() / 1000 >= cur.end) loadCurrentEpg(); else renderNow();
}, 15000);
async function refreshStatus() {
  if (S.mode === 'vod') return;
  try {
    const s = await api('/api/status');
    const open = s.sessions.find((x) => x.live);
    $('#lamp').className = 'lamp' + (open ? ' on' : '');
    if (open) {
      const t = performance.now(), key = open.p + '/' + open.s;
      if (rateLast && rateLast.key === key && open.bytes >= rateLast.bytes && t > rateLast.t) {
        const inst = ((open.bytes - rateLast.bytes) * 8) / ((t - rateLast.t) / 1000);
        rateNow = rateNow ? rateNow * 0.5 + inst * 0.5 : inst;
      } else rateNow = 0;
      rateLast = { key, bytes: open.bytes, t };
    } else { rateLast = null; rateNow = 0; }
    $('#statTxt').textContent = open ? `Streaming ${rateNow ? fmtRate(rateNow) : ''}` : 'Idle';
  } catch { $('#lamp').className = 'lamp'; $('#statTxt').textContent = 'Server unreachable'; }
}
(function poll() { if (!document.hidden && S.me.name !== undefined) refreshStatus(); setTimeout(poll, 4000); })();

/* ---------- preview overlay + fullscreen ---------- */
function showOverlay(title, sub, spinner) {
  const o = $('#ov'); o.replaceChildren(); $('#stage').classList.remove('poster');
  if (spinner) { const sp = el('div', 'spin'); const im = el('img'); im.src = '/icons/icon-192.png'; im.alt = ''; sp.append(im); o.append(sp); }
  o.append(el('strong', '', title));
  if (sub) o.append(el('span', '', sub));

    try {

/* ---- reorder by carrying: pick (optional), then Up/Down move, Left = top, Right = bottom, OK drops, Back cancels ---- */
let CARRY = null;

}

  carryPaint();
}
function carryFinish() { // hold OK: drop whatever is held and leave reordering
  const c = CARRY; if (!c) return;
  if (!c.picking) { if (c.kind === 'chan') saveChannelOrder(); else saveGroupOrder(c.pid); carryEnd('Order saved'); } else carryEnd('Reordering finished');
}

      else if (k === 'left') G.i = 0; else if (k === 'right') G.i = n - 1;
      else if (k === 'pgup') G.i = Math.max(0, G.i - G.vis); else if (k === 'pgdn') G.i = Math.min(n - 1, G.i + G.vis);
      else if (k === 'ok') { c.picking = false; carryPaint(); } else if (k === 'back') carryEnd('Reordering finished');
      renderGuide(); return true;
    }
    if (k === 'back') { const by = new Map(S.items.map((x) => [x.s, x])); S.items = c.orig.map((id) => by.get(id)).filter(Boolean); c.picking = true; carryPaint(); renderGuide(); return true; }
    if (k === 'ok') { saveChannelOrder(); c.orig = S.items.map((x) => x.s); c.picking = true; carryPaint('Order saved.'); return true; }
    const i = G.i, j = k === 'up' ? i - 1 : k === 'down' ? i + 1 : k === 'left' ? 0 : k === 'right' ? n - 1 : i;
    if (j !== i && j >= 0 && j < n) { const [x] = S.items.splice(i, 1); S.items.splice(j, 0, x); G.i = j; renderGuide(); }
    return true;

    else if (k === 'left' && l.length) { T.i = l[0][1]; paintTreeFocus(); } else if (k === 'right' && l.length) { T.i = l[l.length - 1][1]; paintTreeFocus(); }

    return true;
  }

}

    if (c.err) { out.push({ t: 'vretry', p: p.id, label: 'Couldn’t load. OK to retry', child: true }); continue; }
    for (const [k, label, cats, total] of [['movie', 'Movies', c.movies, c.movieTotal], ['show', 'Shows', c.shows, c.showTotal]]) {

    list.push({ icon: '■', label: 'Stop recording', act: async () => { m.close(); try { await send('/api/recordings/stop', { p, s }, 'POST'); toast('Stopped', 2000); } catch (e) { toast(e.message, 4000); } recRefresh(); setTimeout(recRefresh, 6000); } });
  } else {
    list.push({ icon: '⏳', label: it.state === 'unfinished' ? 'Couldn’t be converted' : 'Finishing…', sub: it.state === 'unfinished' ? 'the file is in the share' : '', act: () => m.close() });
    if (it.state === 'unfinished') list.push({ icon: '🗑', label: 'Delete', act: () => { m.close(); recDelete(it); } });
  }
  list.push({ icon: '✕', label: 'Close', act: () => m.close() });
  m = tiles(list);
  m.root.append(el('div', 'fsmeta', `${it.title || it.ch}  ·  ${fmtDur(it.dur)}`));
}
function recDelete(it) {
  let m;
  m = tiles([{ icon: '🗑', label: 'Delete for good', sub: 'This can’t be undone', act: async () => { m.close(); try { await send('/api/recordings/' + encodeURIComponent(it.id), {}, 'DELETE'); toast('Deleted', 2000); } catch (e) { toast(e.message, 4000); } recRefresh(); } }, { icon: '✕', label: 'Keep it', act: () => m.close() }]);
  m.focus(mbs(m)[1]);
  m.root.append(el('div', 'fsmeta', `Delete “${shortText(it.title || it.ch, 40)}”?`));
}
function recPlay(it, at) { // a recording plays in the movie player: same seek bar, same keys
  vodPlay({ pid: 'rec', k: 'rec', id: it.id, n: it.title || it.ch, i: '', ext: 'mp4', ep: null, rec: true, dur: it.dur, url: '/rec/' + encodeURIComponent(it.id) + '.mp4' }, at || 0);
}

/* ---------- search across every provider ---------- */
/* Search in Movies & Shows: every provider that has movies, titles only */
function sortSearch() {
  const needle = V.lastQ.toLowerCase(), yr = (m) => parseInt(m.y, 10) || 0;
  const rank = (m) => { const n = m.n.toLowerCase(); return n.startsWith(needle) ? 0 : n.includes(' ' + needle) ? 1 : 2; };
  const by = { best: (a, b) => rank(a) - rank(b) || a.n.length - b.n.length, az: (a, b) => a.n.localeCompare(b.n), rating: (a, b) => b.r - a.r || a.n.localeCompare(b.n), year: (a, b) => yr(b) - yr(a) || a.n.localeCompare(b.n), new: (a, b) => b.a - a.a || a.n.localeCompare(b.n) };
  V.items.sort(by[V.ssort] || by.best);
}
const sortable = () => S.mode === 'vod' && !!V.sel && (V.sel.k === 'list' || V.sel.k === 'search');
function applySort(o) {
  if (!sortable()) return;
  if (V.sel.k === 'search') { V.ssort = o; V.i = 0; V.top = 0; V.cards.clear(); sortSearch(); paintWall(); return; }
  V.sort = o;
  try { localStorage.setItem('tv.vod.sort', V.sort); } catch (e) { /* not saved */ }
  vodOpenList(V.sel);
}
function sortMenu() {
  if (!sortable()) return;
  const search = V.sel.k === 'search', cur = search ? V.ssort : V.sort;
  const m = listMenu('Sort by'); let at = null;
  for (const o of search ? ['best', 'new', 'az', 'rating', 'year'] : ['new', 'az', 'rating', 'year']) { const r = m.row((o === cur ? '✓   ' : '      ') + SORT_NAME[o], () => applySort(o)); if (o === cur) at = r; }
  m.finish(); if (at) m.focus(at);
}
async function vodSearch() {
  const ps = vodProvs();
  if (!ps.length) return toast('No provider has movies');
  const q = await osk({ title: 'Search movies and shows', value: V.lastQ, okLabel: 'Search', hint: 'Searches every provider that has movies and shows.' });
  if (!q || !q.trim()) return;
  V.lastQ = q.trim();
  const seq = ++V.seq, enc = encodeURIComponent(V.lastQ);
  V.sel = { k: 'search', q: V.lastQ, label: `Search: “${V.lastQ}”` }; V.items = []; V.total = 0; V.i = 0; V.top = 0; V.cards.clear(); V.more = false;
  renderTree(); paintWall('Searching…');
  const res = await Promise.all(ps.flatMap((p) => ['movie', 'show'].map((kind) =>
    api(`/api/p/${p.id}/vod-list?kind=${kind}&q=${enc}&lim=60`).then((j) => j.items.map((m) => norm(p.id, kind, m))).catch(() => []))));
  if (seq !== V.seq) return;
  V.ssort = 'best'; V.items = [].concat(...res); sortSearch();
  V.total = V.items.length;
  paintWall();
  if (V.items.length) setZone('guide');
}

function vodCardMenu() {
  const it = V.items[V.i]; if (!it || it.clear) return;
  const m = listMenu(it.n);
  m.row(it.k === 'show' ? 'Details and episodes' : 'Details', () => vodShowDetail(it));
  if (S.me && S.me.rec) m.row(it.k === 'show' ? 'Download episodes' : 'Download', () => dlAsk(it));
  if (sortable()) m.row(`Sort: ${SORT_NAME[V.sel.k === 'search' ? V.ssort : V.sort]}`, () => sortMenu());
  if (V.sel && V.sel.k === 'hist') m.row('Remove from history', () => { const a = vodHist.all().filter((x) => !sameTitle(x, it)); store.set(vodHist.key(), JSON.stringify(a)); vodOpenList({ k: 'hist' }); renderTree(); });
  m.finish();
}

/* ================= start ================= */
async function init() {
  document.documentElement.classList.add('tv');
  let me;
  if (profiles.all().length >= 2 && !picked.get()) return showProfiles(); // more than one profile on this TV: ask who is watching
  try { me = await api('/api/me'); }
  catch (e) {
    if (e.status === 401) return profiles.all().length ? showProfiles() : showGate();
    $('#gate').hidden = false; $('#gateSub').textContent = 'Can’t reach the server. Retrying…'; return setTimeout(() => location.reload(), 5000);
  }
  S.me = me || {};
  if (me && me.tv && me.name) api('/api/tv/token').then((t) => profiles.put(t.name, t.token)).catch(() => {}); // keep this profile (and refresh its token) for the start screen
  if (me.mustChange) { $('#gate').hidden = false; $('#gateBox').replaceChildren(el('h1', '', 'Choose a new password first'), el('p', '', 'Open Zibbit on a phone or computer, sign in, and choose a new password. Then come back here.')); return; }
  try { await Promise.all([loadScript('hls.min.js'), loadScript('mpegts.js')]); } catch { /* playback will say so */ }
  let info;
  try { info = await api('/api/providers'); } catch (e) { if (e.status === 401) return showGate(); toast(e.message); return; }
  S.providers = info.providers;
  $('#gate').hidden = true; $('#main').hidden = false; sizeCaptions();
  document.documentElement.style.cursor = 'none';
  if (!S.providers.length) { gmsg('No providers yet', 'Add one from Zibbit on a phone or computer.'); renderTree(); setZone('set'); return; }
  const first = S.providers.find((p) => p.id === info.lastProvider) || S.providers[0];
  S.pid = first.id;
  S.open.add(first.id);
  recRefresh(); dlRefresh();
  renderTree();
  const b = await ensureBoot(first.id);
  let saved = null; try { saved = JSON.parse(store.get('tv.sel')); } catch { /* none */ }
  let sel = null;
  if (saved && S.providers.some((p) => p.id === saved.p)) {
    if (saved.p !== first.id) { S.open.add(saved.p); ensureBoot(saved.p); }
    sel = saved;
  } else sel = { p: first.id, k: 'all' };
  if (sel.k === 'grp' && (!bootOf(sel.p) || !bootOf(sel.p).cats || !bootOf(sel.p).cats.has(sel.id))) sel = { p: sel.p, k: 'all' };
  if (sel.k === 'search') sel = { p: sel.p, k: 'all' };
  if (b && !b.err && !b.groups.length && sel.k !== 'fav') { S.sel = sel; renderTree(); gmsg('Choose your groups', 'Open Settings, then Manage groups, and tick the groups you want to watch.'); setZone('side'); }
  else await select(sel);
  S.pid = sel.p;
  // the last channel watched shows in the preview, ready to start with OK on it
  if (info.last && info.last.p === sel.p) {
    try {
      const ch = await api(`/api/p/${info.last.p}/channel?s=${info.last.s}`);
      if (!S.current) { S.current = { s: ch.s, n: ch.n, i: ch.i, p: info.last.p }; renderNow(); showOverlay('Last watched', ch.n); loadCurrentEpg(); }
    } catch { /* channel may be gone */ }
  }
  setZone(S.items.length ? 'guide' : 'side');
  setInterval(() => { if (S.items.length && S.sel && !MODALS.length) { layoutGuide(); renderGuide(); } }, 60000);
}
init();
})();
</script>
