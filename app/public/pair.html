<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1118">
<link rel="icon" type="image/png" href="/icons/favicon-64.png">
<title>Pair a TV · Zibbit</title>
<style>
  :root { --ink:#0c1118; --panel:#131a24; --raised:#1b2432; --line:#28334a; --text:#e8ecf3; --mute:#8996ad; --tally:#ff4a3d; --warn:#ffb454; --ok:#5fd38d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: grid; place-items: center; padding: 16px; min-height: 100vh; }
  main { width: min(400px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: grid; gap: 14px; }
  h1 { margin: 0; font-size: 21px; }
  p { margin: 0; color: var(--mute); }
  p.warn { color: var(--warn); }
  p.ok { color: var(--ok); font-weight: 600; }
  label { display: grid; gap: 6px; color: var(--mute); font-size: 14px; }
  input { font: 600 26px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .12em; text-transform: uppercase; text-align: center; color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 14px 8px; min-height: 56px; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--tally); outline-offset: 2px; }
  button { font: inherit; font-weight: 600; min-height: 50px; border: 0; border-radius: 10px; background: var(--tally); color: #fff; cursor: pointer; }
  button.quiet { background: var(--raised); color: var(--text); }
  button:disabled { opacity: .6; }
  .row { display: grid; gap: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Pair a TV</h1>
  <section id="enter" class="row">
    <p>Type the code shown on your TV.</p>
    <label>Code <input id="code" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="9" placeholder="XXXX-XXXX" inputmode="text"></label>
    <p id="err" class="warn" role="alert"></p>
    <button id="next">Continue</button>
  </section>
  <section id="confirm" class="row" hidden>
    <p id="what"></p>
    <p id="net" class="warn" hidden></p>
    <button id="approve">Sign in this TV</button>
    <button id="cancel" class="quiet">Cancel</button>
  </section>
  <section id="done" class="row" hidden>
    <p class="ok" id="doneMsg"></p>
    <button id="again" class="quiet">Pair another TV</button>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const show = (id) => { for (const s of ['enter', 'confirm', 'done']) $(s).hidden = s !== id; };
const call = async (path, code) => {
  const r = await fetch(path, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { location.replace('/login.html?next=' + encodeURIComponent('/pair' + location.search)); throw new Error('sign in'); }
  if (!r.ok) throw new Error(j.error || 'Something went wrong.');
  return j;
};
let code = '';
const tidy = () => { const v = $('code').value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8); $('code').value = v.length > 4 ? v.slice(0, 4) + '-' + v.slice(4) : v; return v; };
$('code').addEventListener('input', tidy);
async function check() {
  $('err').textContent = '';
  code = tidy();
  if (code.length !== 8) { $('err').textContent = 'The code has 8 letters and numbers.'; return; }
  $('next').disabled = true;
  try {
    const j = await call('/api/pair/lookup', code);
    $('what').textContent = `Sign in ${j.label} with your profile? Only approve if the code is on a TV you are looking at right now.`;
    const net = $('net');
    net.hidden = j.sameNetwork;
    net.textContent = j.sameNetwork ? '' : 'This TV is not on the same network as this phone. If you did not just start this on your own TV, press Cancel.';
    show('confirm');
  } catch (e) { if (e.message !== 'sign in') $('err').textContent = e.message; }
  $('next').disabled = false;
}
$('next').addEventListener('click', check);
$('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') check(); });
$('approve').addEventListener('click', async () => {
  $('approve').disabled = true;
  try { await call('/api/pair/approve', code); $('doneMsg').textContent = 'Done. The TV will sign in within a few seconds.'; show('done'); }
  catch (e) { if (e.message !== 'sign in') { $('err').textContent = e.message; show('enter'); } }
  $('approve').disabled = false;
});
$('cancel').addEventListener('click', () => { $('code').value = ''; show('enter'); });
$('again').addEventListener('click', () => { $('code').value = ''; $('err').textContent = ''; show('enter'); $('code').focus(); });
const pre = new URLSearchParams(location.search).get('code');
if (pre) { $('code').value = pre; history.replaceState(null, '', '/pair'); check(); } else $('code').focus();
</script>
</body>
</html>
